<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS2 Esports Center — Canlı CS2 maçları, fikstür ve istatistikler</title>
  <meta name="description" content="Counter-Strike 2 profesyonel sahnesi tek ekranda: canlı maçlar, fikstür, sonuçlar, puan durumu, kadrolar ve takım istatistikleri.">
  <meta name="theme-color" content="#0b0c0f">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    (() => {
      let saved = null;
      try { saved = localStorage.getItem('theme'); } catch {}
      const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#/" aria-label="CS2 Esports Center ana sayfa">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="var(--accent)"/>
          <g fill="none" stroke="var(--on-accent)" stroke-width="2.2" stroke-linecap="round">
            <circle cx="16" cy="16" r="6.5"/>
            <path d="M16 5.5v5M16 21.5v5M5.5 16h5M21.5 16h5"/>
          </g>
          <circle cx="16" cy="16" r="1.6" fill="var(--on-accent)"/>
        </svg>
        <span><b>CS2</b> Esports Center</span>
      </a>

      <nav class="tabs" aria-label="Bölümler">
        <a href="#/canli" data-tab="canli"><span class="live-dot" aria-hidden="true"></span>Canlı<span class="tab-count" id="live-count"></span></a>
        <a href="#/yaklasan" data-tab="yaklasan">Yaklaşan</a>
        <a href="#/sonuclar" data-tab="sonuclar">Sonuçlar</a>
        <a href="#/turnuvalar" data-tab="turnuvalar">Turnuvalar</a>
      </nav>

      <div class="tools">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Takım, turnuva ara" autocomplete="off" aria-label="Takım veya turnuva ara">
        </label>
        <button class="icon-btn" id="theme-toggle" type="button" aria-label="Temayı değiştir">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="filterbar" id="filterbar">
    <div class="wrap filter-inner">
      <span class="filter-label">Seviye</span>
      <div class="tiers" id="tiers" role="group" aria-label="Turnuva seviyesi filtresi"></div>
    </div>
  </div>

  <main class="wrap" id="view" aria-live="polite">
    <div class="loading"><span class="spinner"></span>Maçlar yükleniyor…</div>
  </main>

  <footer class="wrap footer" id="footer"></footer>

  <noscript><p class="wrap">Bu site için JavaScript gerekli.</p></noscript>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
