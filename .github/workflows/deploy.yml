name: Veri güncelle ve yayınla

on:
  push:
    branches: [main]
  schedule:
    # GitHub zamanlanmış işleri yoğunlukta birkaç dakika geciktirebilir.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Liquipedia eşleşmeleri çalıştırmalar arasında saklanır; aynı takım her seferinde sorgulanmaz.
      - name: Liquipedia önbelleğini geri yükle
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: liquipedia-${{ github.run_id }}
          restore-keys: liquipedia-

      - name: PandaScore verisini çek
        run: node scripts/fetch-data.mjs
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}

      - name: Liquipedia önbelleğini kaydet
        if: hashFiles('cache/liquipedia.json') != ''
        uses: actions/cache/save@v6
        with:
          path: cache
          key: liquipedia-${{ hashFiles('cache/liquipedia.json') }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
